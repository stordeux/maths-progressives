# Relais des signalements (voir src/index.js et README.md de ce dossier).
name = "signalements-maths"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true

# au plus 10 signalements par minute et par adresse IP (syntaxe de wrangler 3, Node 21 sur le poste)
[[unsafe.bindings]]
name = "LIMITEUR"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
